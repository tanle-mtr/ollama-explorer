name: ollama-scan

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "随机探测的 IP 数量"
        required: false
        default: "500"
      cidrs:
        description: "定向网段，空格分隔（如 103.21.140.0/24 5.188.0.0/16）"
        required: false
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install masscan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq masscan
          masscan --version | head -1
      - name: Run scan
        env:
          OLLAMA_API_URL: ${{ vars.OLLAMA_API_URL }}
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
          SCAN_COUNT: ${{ github.event.inputs.count || '500' }}
          SCAN_CIDRS: ${{ github.event.inputs.cidrs || vars.SCAN_CIDRS }}
          MASSCAN_RATE: ${{ vars.MASSCAN_RATE || '100000' }}
        run: |
          echo "Running scan with SCAN_COUNT=${SCAN_COUNT}, SCAN_CIDRS=${SCAN_CIDRS:-not set}"
          node scripts/scan-remote.mjs
          echo "Scan completed"