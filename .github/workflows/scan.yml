name: ollama-scan

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "随机探测的 IP 数量"
        required: false
        default: "500"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scan
        env:
          OLLAMA_API_URL: ${{ vars.OLLAMA_API_URL }}
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
          SCAN_COUNT: ${{ github.event.inputs.count || '500' }}
        run: node scripts/scan-remote.mjs