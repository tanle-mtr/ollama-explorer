name: ollama-scan

on:
  schedule:
    # 每 12 小时运行一次 (UTC 0:30 和 12:30)
    - cron: "30 0,12 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "随机探测的 IP 数量"
        required: false
        default: "1000"
      cidrs:
        description: "定向网段，空格分隔（如 103.21.140.0/24 5.188.0.0/16）"
        required: false
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install masscan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq masscan
          masscan --version | head -1
      - name: Run scan
        env:
          OLLAMA_API_URL: ${{ vars.OLLAMA_API_URL }}
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
          SCAN_COUNT: ${{ github.event.inputs.count || '1000' }}
          SCAN_CIDRS: ${{ github.event.inputs.cidrs || vars.SCAN_CIDRS }}
          MASSCAN_RATE: ${{ vars.MASSCAN_RATE || '500000' }}
        run: |
          echo "Starting scan at $(date)"
          echo "CIDRs: ${SCAN_CIDRS:-none}"
          echo "Rate: ${MASSCAN_RATE} pps"
          node scripts/scan-remote.mjs
          echo "Scan completed at $(date)"